# config/settings.yaml

llm:
  provider: openai
  model: gpt-4o-mini
  api_key: "${OPENAI_API_KEY}"

embedding:
  provider: openai
  model: text-embedding-3-small

vision_llm:
  provider: openai
  model: gpt-4o-mini

vector_store:
  backend: chroma
  persist_path: ./data/db/chroma

retrieval:
  sparse_backend: bm25
  fusion_algorithm: rrf
  top_k_dense: 20
  top_k_sparse: 20
  top_k_final: 10

rerank:
  backend: none
  model: ""
  top_m: 30

evaluation:
  backends: [custom]
  golden_test_set: ./tests/fixtures/golden_test_set.json

observability:
  enabled: true
  log_file: ./logs/traces.jsonl
  dashboard_port: 8501
